name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to tag and publish
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Bump and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "Koray Koska"
          git config user.email "koray@koska.family"
          npm version "${{ inputs.bump }}" --no-git-tag-version
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
            const changelog = readFileSync('CHANGELOG.md', 'utf8');
            if (!changelog.includes('## ' + version)) {
              writeFileSync('CHANGELOG.md', changelog.replace('# Changelog\\n\\n', '# Changelog\\n\\n## ' + version + '\\n\\n- Release ' + version + '.\\n\\n'));
            }
          "
          git add package.json package-lock.json CHANGELOG.md
          version=$(node -p "require('./package.json').version")
          git commit -m "Release ${version}"
          git tag "v${version}"
          git push origin HEAD --follow-tags

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v${version}"
          fi
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match package version $version"
            exit 1
          fi

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already published"
            exit 0
          fi
          tag="latest"
          case "$version" in
            *-*) tag="next" ;;
          esac
          npm publish --provenance --access public --tag "$tag"

      - name: Resolve release tag
        id: tag
        run: |
          version=$(node -p "require('./package.json').version")
          echo "name=v${version}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
