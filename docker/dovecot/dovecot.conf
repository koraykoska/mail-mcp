protocols = imap
listen = *
ssl = yes
ssl_cert = </certs/dovecot-cert.pem
ssl_key = </certs/dovecot-key.pem
ssl_min_protocol = TLSv1.2
disable_plaintext_auth = no
auth_mechanisms = plain login
auth_verbose = no
mail_location = maildir:/var/mail/%u
first_valid_uid = 100
mail_privileged_group = mail

passdb {
  driver = static
  args = password=secret
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/%u
}

namespace inbox {
  type = private
  separator = /
  prefix =
  inbox = yes
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}

plugin {
  quota = count:User quota
  quota_rule = *:storage=10M
  quota_vsizes = yes
}

protocol imap {
  mail_plugins = $mail_plugins imap_quota quota
}

!include_try /etc/dovecot/conf.d/99-capability.conf
